<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Industry Research Agent architecture</title>
  <desc id="desc">A layered architecture from user interface and API through run store, skill router, LangGraph agents, MCP research, evidence validation and report artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4faf7"/><stop offset="1" stop-color="#e8f3ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#123f32" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f8066"/></marker>
    <style>
      .box{stroke:#b7d9ca;stroke-width:2;rx:16;filter:url(#shadow)} .title{font:700 20px 'Microsoft YaHei',sans-serif;fill:#123f32}.text{font:15px 'Microsoft YaHei',sans-serif;fill:#35544a}.small{font:13px 'Microsoft YaHei',sans-serif;fill:#58756a}.arrow{stroke:#2f8066;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="55" class="title" font-size="28">行业研究 Agent · 可验证工程架构</text>
  <text x="60" y="83" class="small">Evidence-first research · Skill routing · Durable Run · Evaluation</text>

  <rect x="55" y="120" width="1090" height="92" fill="#ffffff" class="box"/>
  <text x="82" y="153" class="title">用户与交互层</text><text x="82" y="183" class="text">问卷式访谈 · SSE 流式进度 · 历史会话 · 报告下载 · 追问</text>
  <rect x="55" y="250" width="1090" height="92" fill="#ffffff" class="box"/>
  <text x="82" y="283" class="title">API 与可靠执行层</text><text x="82" y="313" class="text">Starlette API · Run Store · SQLite Checkpoint · Lease / Heartbeat / Fencing · Artifact Store</text>
  <rect x="55" y="380" width="1090" height="92" fill="#e5f7ee" class="box"/>
  <text x="82" y="413" class="title">路由与 Agent 编排层</text><text x="82" y="443" class="text">Triage → Skill Registry → Supervisor → LangGraph Worker Nodes</text>
  <rect x="80" y="510" width="330" height="130" fill="#ffffff" class="box"/>
  <text x="105" y="545" class="title">研究工具层</text><text x="105" y="575" class="text">MCP Search / Fetch</text><text x="105" y="600" class="text">Direct Provider fallback</text><text x="105" y="625" class="small">超时 · 重试 · Prompt Injection 防御</text>
  <rect x="435" y="510" width="330" height="130" fill="#ffffff" class="box"/>
  <text x="460" y="545" class="title">证据与质量层</text><text x="460" y="575" class="text">Pydantic Evidence</text><text x="460" y="600" class="text">Claim / Citation Validation</text><text x="460" y="625" class="small">独立 Judge（可选）</text>
  <rect x="790" y="510" width="330" height="130" fill="#ffffff" class="box"/>
  <text x="815" y="545" class="title">结果与评测层</text><text x="815" y="575" class="text">Plain-text Report + 可点击引用</text><text x="815" y="600" class="text">Harness / Online Eval / Ablation</text><text x="815" y="625" class="small">Token · 成本 · 延迟 · 成功率</text>

  <path d="M600 212 L600 246" class="arrow"/><path d="M600 342 L600 376" class="arrow"/><path d="M600 472 L245 506" class="arrow"/><path d="M600 472 L600 506" class="arrow"/><path d="M600 472 L955 506" class="arrow"/>
  <text x="625" y="232" class="small">创建 / 恢复 Run</text><text x="625" y="362" class="small">选择可执行 Skill</text>
  <text x="60" y="684" class="small">当前运行依赖：Python 3.11 · LangGraph · MCP · SQLite；Redis/PostgreSQL 为生产迁移方案</text>
</svg>
