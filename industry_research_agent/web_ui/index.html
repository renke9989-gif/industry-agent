<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行业调研智能体 · 多智能体协作版</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --sidebar-bg: #1e1e2e;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --accent: #6366f1;
            --user-bubble: #6366f1;
            --card: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ============ 侧边栏 ============ */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
        }

        .sidebar .logo {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar .logo .icon {
            font-size: 26px;
        }

        .sidebar .subtitle {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 24px;
        }

        .sidebar .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .sidebar .progress-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
        }

        .dim-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }

        .dim-item .dim-name {
            color: #d1d5db;
        }

        .dim-item .dim-status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .dim-status.pending {
            background: #374151;
            color: #9ca3af;
        }

        .dim-status.done {
            background: #10b981;
            color: #fff;
        }

        .dim-status.active {
            background: #f59e0b;
            color: #fff;
        }

        .sidebar .agents-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px;
        }

        .agent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            font-size: 13px;
            color: #d1d5db;
            transition: all 0.2s;
        }

        .agent-item.active {
            color: #fff;
            font-weight: 600;
        }

        .agent-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6b7280;
            transition: all 0.3s;
        }

        .agent-item.active .dot {
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }

        .sidebar .footer {
            margin-top: auto;
            font-size: 11px;
            color: #6b7280;
            text-align: center;
        }

        /* ============ 主区域 ============ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .main-header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-header .title {
            font-size: 16px;
            font-weight: 600;
        }

        .main-header .reset-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.2s;
        }

        .main-header .reset-btn:hover {
            background: #f3f4f6;
            color: var(--text);
        }

        /* ============ 聊天区 ============ */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: #f3f4f6;
        }

        .message .body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .message .meta {
            font-size: 12px;
            color: var(--text-light);
        }

        .message .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* 用户消息 */
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.user .avatar {
            background: var(--user-bubble);
        }

        .message.user .bubble {
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.user .meta {
            text-align: right;
        }

        /* 分析师消息 */
        .message.analyst .bubble {
            background: var(--card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        /* 监督者消息 */
        .message.supervisor .bubble {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            color: #4338ca;
            font-size: 13px;
        }

        /* 报告消息 */
        .message.report .bubble {
            background: #f0fdf4;
            border: 1px solid #86efac;
            white-space: pre-wrap;
        }

        .message.report .bubble {
            max-width: 100%;
        }

        /* 思考过程（折叠区，类似 DeepSeek） */
        .message.thinking .bubble {
            background: #fafafa;
            border: 1px dashed #d1d5db;
            color: #9ca3af;
            font-size: 12px;
        }

        .thinking-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            color: #9ca3af;
            font-size: 12px;
            padding: 4px 0;
            transition: color 0.2s;
        }

        .thinking-toggle:hover {
            color: #6b7280;
        }

        .thinking-toggle .arrow {
            transition: transform 0.2s;
            display: inline-block;
        }

        .thinking-toggle .arrow.open {
            transform: rotate(90deg);
        }

        .thinking-content {
            display: none;
            margin-top: 8px;
            padding: 10px 12px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 12px;
            color: #6b7280;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            font-family: "SF Mono", "Consolas", "Courier New", monospace;
            line-height: 1.5;
        }

        .thinking-content.show {
            display: block;
        }

        /* ============ 输入区 ============ */
        .input-area {
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-area textarea {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            min-height: 44px;
            max-height: 150px;
            line-height: 1.5;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .input-area .send-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .input-area .send-btn:hover {
            background: #4f46e5;
        }

        .input-area .send-btn:disabled {
            background: #c7d2fe;
            cursor: not-allowed;
        }

        /* 打字中指示器 */
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #9ca3af;
            animation: bounce 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* 快捷示例 */
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .example-chip {
            background: #f3f4f6;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.2s;
        }

        .example-chip:hover {
            background: #e5e7eb;
            color: var(--text);
        }

        /* 欢迎界面 */
        .welcome {
            text-align: center;
            margin: auto;
            max-width: 600px;
        }

        .welcome .big-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .welcome h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--text-light);
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- ============ 侧边栏 ============ -->
    <div class="sidebar">
        <div class="logo">
            <span class="icon">🔍</span>
            <span>行业调研智能体</span>
        </div>
        <div class="subtitle">Multi-Agent Industry Research</div>

        <div class="section-title">调研进度</div>
        <div class="progress-box" id="progress-box">
            <div class="dim-item"><span class="dim-name">市场规模</span><span class="dim-status pending" id="dim-市场">待调研</span></div>
            <div class="dim-item"><span class="dim-name">竞争格局</span><span class="dim-status pending" id="dim-竞争">待调研</span></div>
            <div class="dim-item"><span class="dim-name">商业模式</span><span class="dim-status pending" id="dim-商业模式">待调研</span></div>
            <div class="dim-item"><span class="dim-name">市场机会</span><span class="dim-status pending" id="dim-机会">待调研</span></div>
            <div class="dim-item"><span class="dim-name">进入风险</span><span class="dim-status pending" id="dim-风险">待调研</span></div>
            <div class="dim-item"><span class="dim-name">发展趋势</span><span class="dim-status pending" id="dim-趋势">待调研</span></div>
        </div>

        <div class="section-title">智能体团队</div>
        <div class="agents-box" id="agents-box">
            <div class="agent-item" id="agent-supervisor"><span class="dot"></span>🤖 协调监督者</div>
            <div class="agent-item" id="agent-market_analyst"><span class="dot"></span>📈 市场趋势分析师</div>
            <div class="agent-item" id="agent-competition_analyst"><span class="dot"></span>⚔️ 竞争格局分析师</div>
            <div class="agent-item" id="agent-business_analyst"><span class="dot"></span>💰 商业模式分析师</div>
        </div>

        <div class="footer">基于 LangGraph 多智能体架构</div>
    </div>

    <!-- ============ 主区域 ============ -->
    <div class="main">
        <div class="main-header">
            <div class="title">行业调研对话</div>
            <button class="reset-btn" id="reset-btn">🔄 重新调研</button>
        </div>

        <div class="chat-area" id="chat-area">
            <!-- 欢迎界面 -->
            <div class="welcome" id="welcome">
                <div class="big-icon">🔍</div>
                <h1>想调研什么行业？</h1>
                <p>告诉我你想进入的赛道或想做的生意，我会调度市场分析师、竞争分析师和商业模式分析师，为你输出一份完整的行业调研报告。</p>
                <div class="examples">
                    <div class="example-chip" onclick="sendExample(this.textContent)">我想在二线城市开一家宠物烘焙店，预算30万</div>
                    <div class="example-chip" onclick="sendExample(this.textContent)">咖啡赛道现在还能进吗</div>
                    <div class="example-chip" onclick="sendExample(this.textContent)">二手奢侈品电商的利润率大概多少</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <textarea id="input" placeholder="输入你想调研的行业或想做的生意..." rows="1"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chat-area');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const welcome = document.getElementById('welcome');

        let currentMessageDiv = null;  // 当前正在构建的消息

        // ============ 工具函数 ============
        function setActiveAgent(node) {
            // 清除所有 active
            document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
            if (node && node !== 'report_generator') {
                const el = document.getElementById('agent-' + node);
                if (el) el.classList.add('active');
            }
        }

        function updateProgress(scores) {
            for (const [dim, score] of Object.entries(scores)) {
                const el = document.getElementById('dim-' + dim);
                if (!el) continue;
                if (score > 0) {
                    el.textContent = score + '/5';
                    el.className = 'dim-status done';
                } else {
                    el.textContent = '待调研';
                    el.className = 'dim-status pending';
                }
            }
        }

        function addMessage(type, data) {
            // 隐藏欢迎界面
            if (welcome && welcome.style.display !== 'none') {
                welcome.style.display = 'none';
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + type;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = data.icon || '💬';
            if (data.color) avatar.style.background = data.color + '22';

            const body = document.createElement('div');
            body.className = 'body';

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = data.name || '';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = data.content || '';

            body.appendChild(meta);
            body.appendChild(bubble);
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(body);

            chatArea.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function addThinking(data) {
            // 思考过程：折叠展示，默认收起
            if (welcome && welcome.style.display !== 'none') {
                welcome.style.display = 'none';
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message thinking';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = data.icon || '💭';

            const body = document.createElement('div');
            body.className = 'body';

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = data.name || '思考过程';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            // 折叠开关
            const toggle = document.createElement('div');
            toggle.className = 'thinking-toggle';
            toggle.innerHTML = '<span class="arrow">▶</span><span>思考过程</span>';

            // 折叠内容
            const content = document.createElement('div');
            content.className = 'thinking-content';
            content.textContent = data.content || '';

            toggle.addEventListener('click', () => {
                const arrow = toggle.querySelector('.arrow');
                if (content.classList.contains('show')) {
                    content.classList.remove('show');
                    arrow.classList.remove('open');
                } else {
                    content.classList.add('show');
                    arrow.classList.add('open');
                }
            });

            bubble.appendChild(toggle);
            bubble.appendChild(content);
            body.appendChild(meta);
            body.appendChild(bubble);
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(body);

            chatArea.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function addUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '👤';

            const body = document.createElement('div');
            body.className = 'body';

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = '你';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            body.appendChild(meta);
            body.appendChild(bubble);
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(body);

            chatArea.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function sendExample(text) {
            input.value = text;
            sendMessage();
        }

        // ============ 发送消息 ============
        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // 禁用输入
            input.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '调研中...';

            addUserMessage(text);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                // 读取 SSE 流
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();  // 保留最后不完整的一行

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const dataStr = line.slice(5).trim();
                            if (!dataStr) continue;
                            try {
                                const data = JSON.parse(dataStr);
                                handleEvent(data);
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }
            } catch (e) {
                addMessage('analyst', {
                    icon: '❌',
                    name: '错误',
                    content: '请求失败：' + e.message,
                    color: '#ef4444',
                });
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
                setActiveAgent(null);
            }
        }

        function handleEvent(data) {
            switch (data.type) {
                case 'agent_active':
                    setActiveAgent(data.node);
                    break;

                case 'progress':
                    updateProgress(data.scores);
                    break;

                case 'supervisor':
                    addMessage('supervisor', {
                        icon: data.icon,
                        name: data.name + '（决策）',
                        content: data.content,
                        color: data.color,
                    });
                    break;

                case 'report':
                    addMessage('report', {
                        icon: data.icon,
                        name: data.name,
                        content: data.content,
                        color: data.color,
                    });
                    break;

                case 'analyst':
                    addMessage('analyst', {
                        icon: data.icon,
                        name: data.name,
                        content: data.content,
                        color: data.color,
                    });
                    break;

                case 'thinking':
                    addThinking(data);
                    break;

                case 'done':
                    // 调研完成
                    addMessage('analyst', {
                        icon: '✅',
                        name: '调研完成',
                        content: '行业：' + data.industry + ' | 轮次：' + data.turn_count,
                        color: '#10b981',
                    });
                    break;

                case 'error':
                    addMessage('analyst', {
                        icon: '❌',
                        name: '错误',
                        content: data.message,
                        color: '#ef4444',
                    });
                    break;
            }
        }

        // ============ 回车发送 ============
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 自动调整输入框高度
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 150) + 'px';
        });

        // 重置
        document.getElementById('reset-btn').addEventListener('click', async () => {
            await fetch('/reset');
            chatArea.innerHTML = '';
            // 恢复欢迎界面
            const newWelcome = document.createElement('div');
            newWelcome.className = 'welcome';
            newWelcome.id = 'welcome';
            newWelcome.innerHTML = `
                <div class="big-icon">🔍</div>
                <h1>想调研什么行业？</h1>
                <p>告诉我你想进入的赛道或想做的生意，我会调度市场分析师、竞争分析师和商业模式分析师，为你输出一份完整的行业调研报告。</p>
                <div class="examples">
                    <div class="example-chip" onclick="sendExample(this.textContent)">我想在二线城市开一家宠物烘焙店，预算30万</div>
                    <div class="example-chip" onclick="sendExample(this.textContent)">咖啡赛道现在还能进吗</div>
                    <div class="example-chip" onclick="sendExample(this.textContent)">二手奢侈品电商的利润率大概多少</div>
                </div>
            `;
            chatArea.appendChild(newWelcome);
            // 重置进度条
            ['市场','竞争','商业模式','机会','风险','趋势'].forEach(dim => {
                const el = document.getElementById('dim-' + dim);
                if (el) { el.textContent = '待调研'; el.className = 'dim-status pending'; }
            });
            // 重新绑定 welcome
            window.welcome = document.getElementById('welcome');
        });
    </script>
</body>
</html>
